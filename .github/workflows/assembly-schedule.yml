name: 국회 위원회 일정 가져오기

on:
  schedule:
    - cron: "50 22 * * *"   # 매일 07:50 (한국시간)
    - cron: "50 3 * * *"    # 매일 12:50 (한국시간)
    - cron: "50 8 * * *"    # 매일 17:50 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 'Run workflow'로 바로 실행
  push:                      # .github/run-now.txt 를 고치면 바로 한 번 실행 (fail-test.txt 는 일부러 틀린 키로 실패 시험)
    paths:
      - ".github/run-now.txt"
      - ".github/fail-test.txt"

permissions:
  contents: write
  issues: write

concurrency:
  group: assembly-schedule
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 위원회 회의 일정 받기
        env:
          ASSEMBLY_API_KEY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[실패시험]') && 'TEST-INVALID-KEY' || secrets.ASSEMBLY_API_KEY }}
        id: fetch
        continue-on-error: true
        run: python scripts/fetch_assembly.py
      - name: 예산 심사 회의만 골라 정리
        if: steps.fetch.outcome == 'success'
        env:
          YC_ALERT_FILE: ${{ runner.temp }}/yc_alert.md
        run: python scripts/parse_budget.py
      - name: 예결위 일정이 바뀌면 알림(이슈 → 이메일)
        if: steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f="${{ runner.temp }}/yc_alert.md"
          if [ -s "$f" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "[현황판 알림] 예결위 예산안 심사 일정 변경 ($(TZ=Asia/Seoul date '+%m/%d %H:%M'))" \
              --body-file "$f" --assignee "${{ github.repository_owner }}"
          else
            echo "예결위 일정 변경 없음"
          fi
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain 439th_session/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 439th_session/data
            git commit -m "국회 위원회 일정 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          else
            echo "변경 없음"
          fi
      - name: 실패하면 알림(이슈 → 이메일), 이미 열린 실패 알림이 있으면 중복으로 보내지 않음
        if: failure() || steps.fetch.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          msg=$(python3 -c "import json;d=json.load(open('439th_session/data/fetch_status.json'));print(d.get('message',''))" 2>/dev/null || echo "알 수 없는 오류")
          open=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title 국회 일정 자동 수집 실패" --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            printf '%s\n' \
              "현황판이 국회 위원회 일정을 불러오지 못했습니다. 그동안 현황판의 예산 심사 일정은 마지막으로 불러온 내용 그대로입니다." "" \
              "- 실패 시각: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" \
              "- 원인(국회 API 응답): ${msg}" \
              "- 실행 기록: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "" \
              "다음 자동 실행(07:50 · 12:50 · 17:50)에서 다시 시도합니다. 정상으로 돌아오면 이 알림은 자동으로 닫히고 '복구' 메일이 갑니다." \
              "인증키 문제(ERROR-290 등)라면 열린국회정보에서 키를 확인한 뒤 Settings → Secrets → ASSEMBLY_API_KEY 를 바꿔 주세요." > body.md
            gh issue create --repo "${{ github.repository }}" \
              --title "[현황판 알림] 국회 일정 자동 수집 실패 ($(TZ=Asia/Seoul date '+%m/%d %H:%M'))" \
              --body-file body.md --assignee "${{ github.repository_owner }}"
          else
            echo "이미 열린 실패 알림 #$open 이 있어 새로 보내지 않음"
          fi
          exit 1
      - name: 정상으로 돌아오면 실패 알림 닫기
        if: success() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "${{ github.repository }}" --state open --search "in:title 국회 일정 자동 수집 실패" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "${{ github.repository }}" --comment "복구되었습니다. $(TZ=Asia/Seoul date '+%m/%d %H:%M')에 국회 위원회 일정을 정상으로 불러왔습니다."
          done
