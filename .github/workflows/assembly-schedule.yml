name: 국회 위원회 일정 가져오기

on:
  schedule:
    - cron: "50 22 * * *"   # 매일 07:50 (한국시간)
    - cron: "50 3 * * *"    # 매일 12:50 (한국시간)
    - cron: "50 8 * * *"    # 매일 17:50 (한국시간)
  workflow_dispatch: {}      # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

concurrency:
  group: assembly-schedule
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 위원회 회의 일정 받기
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
        run: python scripts/fetch_assembly.py
      - name: 바뀐 내용 저장
        run: |
          if [ -n "$(git status --porcelain 439th_session/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 439th_session/data
            git commit -m "국회 위원회 일정 자동 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M'))"
            git push
          else
            echo "변경 없음"
          fi
